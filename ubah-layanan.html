<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ubah Data Layanan - NAT Laundry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <style>
    /* Styling tombol back agar selaras dengan SVG ikon */
    .ul-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #fff;
      border: 1px solid var(--biru-muda, var(--line));
      color: var(--biru, var(--blue));
      margin: 6px 0 20px;
    }
    .ul-back .ic {
      width: 12px;
      height: 12px;
      flex: none;
    }
    .ul-back:hover {
      background: var(--abu, var(--soft));
    }
  </style>
</head>
<body>

  <!-- SPRITE IKON -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-dash" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2l2.4 10h9.2L19 7H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="16" cy="19" r="1.4"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.2 2.8-5.2 6-5.2s6 2 6 5.2"/><path d="M16 5.5a3 3 0 010 5.6M18 14c2 .7 3 2.3 3 5"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="2"/><path d="M9 7V5h6v2"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 10h8M8 14h5"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  </svg>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="logo">NAT Laundry</div>
      <button type="button" class="hamburger" aria-label="Buka menu" aria-expanded="false"
              onclick="this.setAttribute('aria-expanded', document.getElementById('sidebar').classList.toggle('open'))">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <line class="l1" x1="4" y1="6"  x2="20" y2="6"/>
          <line class="l2" x1="4" y1="12" x2="20" y2="12"/>
          <line class="l3" x1="4" y1="18" x2="20" y2="18"/>
        </svg>
      </button>
    </div>

    <nav>
      <a href="dashboard.html"><svg class="ic"><use href="#i-dash"/></svg>Dashboard</a>
      <a href="data-pesanan.html"><svg class="ic"><use href="#i-cart"/></svg>Data Pesanan</a>
      <a href="data-pelanggan.html"><svg class="ic"><use href="#i-users"/></svg>Data Pelanggan</a>
      <a href="data-layanan.html" class="active"><svg class="ic"><use href="#i-box"/></svg>Data Layanan</a>
      <a href="data-jenis-layanan.html"><svg class="ic"><use href="#i-tag"/></svg>Jenis Layanan</a>
      <a href="laporan-transaksi.html"><svg class="ic"><use href="#i-file"/></svg>Laporan Transaksi</a>
    </nav>
  </aside>

  <main class="content">
    <div class="topbar">
      <h1><b>Ubah</b> Data Layanan</h1>
      <!-- DROPDOWN PROFIL ADMIN -->
      <details class="pf">
        <summary class="admin">
          <span class="av">👤</span>
          <div><b>Raditya Arya</b>Admin Laundry</div>
          <svg class="ic chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </summary>
        <div class="pf-card">
          <div class="nm">Raditya Arya</div>
          <div class="sub">Admin Laundry</div>
          <a class="item" href="profil-admin.html">Profil saya</a>
          <a class="mbtn block" href="#modalLogout">Logout</a>
        </div>
      </details>
    </div>

    <a href="data-layanan.html" class="ul-back" aria-label="Kembali"><svg class="ic"><use href="#i-back"/></svg></a>

    <form action="#" method="post">
      <div class="card form-card">
        <div class="fgrid">
          <div>
            <label for="jenis">Jenis Layanan</label>
            <select id="jenis" name="jenis" class="fld" required>
              <option>Cuci Kiloan</option>
              <option>Cuci Satuan</option>
              <option selected>Cuci Satuan Manual</option>
            </select>
          </div>
          <div>
            <label for="tipe">Tipe Laundry</label>
            <select id="tipe" name="tipe" class="fld" required>
              <option selected>REGULAR 3X24 JAM</option>
              <option>EXPRESS 1X24 JAM</option>
            </select>
          </div>
          <div>
            <label for="nama">Nama Layanan</label>
            <input type="text" id="nama" name="nama" placeholder="Masukkan nama layanan" value="Tote Bag" required>
          </div>
          <div class="two-in">
            <div>
              <label for="harga">Harga</label>
              <div class="phone"><span class="pre">Rp.</span><input type="number" id="harga" name="harga" min="0" placeholder="Harga layanan" value="11000" required></div>
            </div>
            <div>
              <label for="satuan">Satuan</label>
              <select id="satuan" name="satuan" class="fld">
                <option>kg</option>
                <option selected>pcs</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <div class="below">
        <button type="submit" class="btn lg" style="background:var(--blue);color:#fff;font-weight:600">Ubah Data</button>
      </div>
    </form>
  </main>

  <!-- CARD LOGOUT -->
  <div class="modal" id="modalLogout">
    <div class="card">
      <h3>Logout</h3>
      <p>Apakah anda yakin ingin logout?</p>
      <div class="act">
        <a class="mbtn ghost" href="#">Batal</a>
        <a class="mbtn" href="login.html">Logout</a>
      </div>
    </div>
  </div>

</body>
</html>
