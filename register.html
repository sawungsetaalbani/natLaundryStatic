<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi Akun - NAT Laundry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrapper wide">
    <div class="register-heading">
        <a href="login.html" class="back" aria-label="Kembali">
            <i data-lucide="chevron-left"></i>
        </a>
        <div class="header">
            <div>
                <small>Lengkapi data,</small>
                <h1>Registrasi Akun</h1>
            </div>
        </div>
    </div>

    <form class="card" action="#" method="post">
      <div class="grid">
        <div class="group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
        </div>
        <div class="group">
          <label for="telp">Nomor Telepon</label>
          <input type="tel" id="telp" name="telp" placeholder="Masukkan nomor telepon" required>
        </div>

        <div class="group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Masukkan username" required>
        </div>
        <div class="group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" placeholder="Masukkan password" required>
            <span class="toggle" aria-hidden="true">
              <i data-lucide="eye"></i>
            </span>
          </div>
        </div>

        <div class="group">
          <label for="alamat">Alamat</label>
          <textarea id="alamat" name="alamat" placeholder="Masukkan alamat" required></textarea>
        </div>
        <div class="actions">
          <button type="submit" class="btn">Daftar Akun</button>
        </div>
      </div>
      <p class="foot">Sudah memiliki akun? <a href="login.html">Login</a></p>
    </form>
  </div>

  <!-- ICON LUCIDE -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
