<body>

  <aside class="sidebar">
    <div class="logo">NAT Laundry</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="data-pesanan.html">Data Pesanan</a>
      <a href="data-pelanggan.html" class="active">Data Pelanggan</a>

      <a href="laporan-transaksi.html">Laporan Transaksi</a>
    </nav>
  </aside>

  <main class="content">
    <div class="topbar">
      <h1><b>Ubah</b> Data Pelanggan</h1>
      <div class="admin"><span class="av">👤</span><div><b>Nama Admin</b>Administrator</div></div>
    </div>

    <a href="data-pelanggan.html" class="back" aria-label="Kembali">&lsaquo;</a>
    <form class="card form-card" action="#" method="post">
      <div class="fgrid">
        <div class="col-stack">
          <div><label for="nama">Nama Pelanggan</label><input type="text" id="nama" name="nama" placeholder="Masukkan nama pelanggan" value="Raditya Arya IFA" required></div>
          <div><label for="username">Username</label><input type="text" id="username" name="username" placeholder="Masukkan username" value="radit21" required></div>
          <div><label for="password">Password</label><div class="pass"><input type="password" id="password" name="password" placeholder="Masukkan password" value="12345678" required><span class="eye" aria-hidden="true">👁</span></div></div>
        </div>
        <div class="col-stack">
          <div><label for="telp">Nomor Telepon</label><div class="phone"><span class="pre">+62</span><input type="text" id="telp" name="telp" placeholder="Nomor telepon" value="85321456789" required></div></div>
          <div class="stretch" style="flex:1"><label for="alamat">Alamat</label><textarea id="alamat" name="alamat" placeholder="Masukkan alamat pelanggan" required>Jalan Tanjungtirto No 10, Kamogni, Kabupaten Malang, Jawa Timur</textarea></div>
        </div>
      </div>
      <div class="form-actions"><button type="submit" class="btn lg" style="background:var(--blue);color:#fff;font-weight:600">Ubah Data</button></div>
    </form>
  </main>

</body>
