<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Layanan - NAT Laundry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
<!-- SIDEBAR -->
  <input type="checkbox" id="toggle-sidebar" hidden>
  <aside class="sidebar">
    <div class="logo"><b>NAT</b> Laundry</div>
    <hr style="border: 1px dashed var(--sky); margin-bottom: 40px;">
    <nav>
      <a href="dashboard.html"><i data-lucide="layout-dashboard"></i>Dashboard</a>
      <a href="data-pesanan.html"><i data-lucide="shopping-cart"></i>Data Pesanan</a>
      <a href="data-pelanggan.html"><i data-lucide="users"></i>Data Pelanggan</a>
      <a href="#" class="active"><i data-lucide="package"></i>Data Layanan</a>
      <a href="data-jenis-layanan.html"><i data-lucide="layers"></i>Jenis Layanan</a>
      <a href="laporan-transaksi.html"><i data-lucide="file-text"></i>Laporan Transaksi</a>
    </nav>
  </aside>
  <label for="toggle-sidebar" class="overlay"></label>

  <main class="content">
    <div class="topbar">
      <label for="toggle-sidebar" class="menu-toggle" aria-label="Buka menu"><i data-lucide="menu"></i></label>
      <h1><b>Tambah</b> Layanan</h1>
      <details class="admin">
       <summary>
          <i data-lucide="user-round"></i>
          <div><b>Raditya Arya</b><small>Administrator</small></div>
          <i data-lucide="chevron-down"></i>
        </summary>
        <div class="dropdown">
          <p><b>Halo, Raditya Arya!</b>Administrator</p>
          <a href="beranda.html" class="btn"><i data-lucide="log-out"></i>Logout</a>
        </div>
      </details>
    </div>

    <a href="data-layanan.html" class="kembali" aria-label="Kembali">
        <i data-lucide="chevron-left"></i>
    </a>
    <form action="#" method="post">
      <div class="card form-card">
        <div class="fgrid">
          <div><label for="jenis">Jenis Layanan</label>
            <select id="jenis" name="jenis" class="fld" required><option value="">Pilih jenis layanan</option><option>Cuci Kiloan</option><option>Cuci Satuan</option><option>Cuci Manual</option></select></div>
          <div><label for="tipe">Tipe Laundry</label>
            <select id="tipe" name="tipe" class="fld" required><option selected>REGULAR 3X24 JAM</option><option>EXPRESS 1X24 JAM</option></select></div>
          <div><label for="nama">Nama Layanan</label>
            <input type="text" id="nama" name="nama" placeholder="Masukkan nama layanan" value="" required></div>
          <div class="two-in">
              <div>
                  <label for="harga">Harga</label>
                  <div class="price-input">
                      <span>Rp.</span>
                      <input type="number" id="harga" name="harga" min="0" placeholder="Harga layanan" required>
                  </div>
              </div>
              <div>
                  <label for="satuan">Satuan</label>
                  <select id="satuan" name="satuan" class="fld">
                      <option selected>kg</option>
                      <option>pcs</option>
                  </select>
              </div>
          </div>
        </div>
      </div>
      <div class="below"><button type="submit" class="btn lg" style="background:var(--blue);color:#fff;font-weight:600">Simpan Data</button></div>
    </form>
  </main>
<!-- ICON LUCIDE -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
